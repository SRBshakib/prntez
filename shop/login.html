<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Login - PrintShare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800 flex items-center justify-center min-h-screen" x-data="loginForm()">

    <div class="w-full max-w-md p-6">
        <div class="text-center mb-8">
            <a href="../index.html" class="inline-flex items-center gap-2 text-2xl font-bold text-blue-600">
                <i data-lucide="printer" class="w-8 h-8"></i>
                PrintShare
            </a>
            <h1 class="text-2xl font-bold text-slate-900 mt-4">Welcome back</h1>
            <p class="text-slate-500 mt-1">Sign in to your shop dashboard</p>
        </div>

        <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200">
            <!-- Error Alert -->
            <div x-show="errorMsg" x-transition class="mb-6 p-4 bg-red-50 text-red-700 rounded-lg flex items-start gap-3 border border-red-200" style="display: none;">
                <i data-lucide="alert-circle" class="w-5 h-5 mt-0.5 shrink-0"></i>
                <span x-text="errorMsg"></span>
            </div>

            <form @submit.prevent="submitForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                    <input type="email" x-model="email" required placeholder="shop@example.com"
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <div class="relative">
                        <input :type="showPassword ? 'text' : 'password'" x-model="password" required
                            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition pr-10">
                        <button type="button" @click="showPassword = !showPassword" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600">
                            <i :data-lucide="showPassword ? 'eye-off' : 'eye'" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" x-model="rememberMe" class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                        <span class="text-sm text-slate-600">Remember me</span>
                    </label>
                    <a href="#" class="text-sm text-blue-600 hover:underline">Forgot password?</a>
                </div>

                <button type="submit" :disabled="loading" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition flex justify-center items-center gap-2 disabled:opacity-70 mt-6">
                    <span x-show="!loading">Sign In</span>
                    <span x-show="loading">Signing in...</span>
                    <i x-show="loading" data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>
                </button>
            </form>
            
            <div class="mt-6 text-center text-sm text-slate-600">
                Don't have a shop account? <a href="register.html" class="text-blue-600 font-medium hover:underline">Register your shop</a>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        document.addEventListener('alpine:init', () => {
            Alpine.data('loginForm', () => ({
                email: '',
                password: '',
                rememberMe: false,
                showPassword: false,
                loading: false,
                errorMsg: '',

                async submitForm() {
                    this.errorMsg = '';
                    this.loading = true;

                    try {
                        const body = new URLSearchParams();
                        body.append('email', this.email);
                        body.append('password', this.password);

                        const res = await fetch('/printshare/api/auth.php?action=shop_login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: body.toString()
                        });

                        const data = await res.json();

                        if (data.success) {
                            window.location.href = 'dashboard.html';
                        } else {
                            this.errorMsg = data.error || 'Invalid email or password.';
                        }
                    } catch (err) {
                        this.errorMsg = 'A network error occurred. Please try again.';
                    } finally {
                        this.loading = false;
                        setTimeout(() => lucide.createIcons(), 0);
                    }
                }
            }));
        });
    </script>
</body>
</html>
