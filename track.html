<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Job - PrintShare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col" x-data="trackApp()">

    <!-- Top Navigation -->
    <nav class="bg-white border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="index.html" class="flex items-center space-x-2">
                    <i data-lucide="printer" class="w-8 h-8 text-blue-600"></i>
                    <span class="font-bold text-xl tracking-tight text-blue-900">PrintShare</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-lg mx-auto w-full p-4 sm:pt-10">
        
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-6">
            <div class="p-6 border-b border-slate-100 bg-slate-50">
                <h1 class="text-xl font-bold text-slate-900 text-center">Track Your Print Job</h1>
            </div>
            <div class="p-6">
                <form @submit.prevent="trackJob" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2 text-center">Enter 4-Digit Job Number</label>
                        <input type="text" x-model="jobCodeInput" maxlength="4" placeholder="e.g. 0042" 
                               class="w-full text-center text-4xl font-bold tracking-widest border-2 border-slate-300 rounded-xl py-4 focus:ring-blue-500 focus:border-blue-500 placeholder-slate-300 uppercase">
                    </div>
                    <button type="submit" :disabled="loading || jobCodeInput.length < 4" 
                            class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 disabled:opacity-50 transition-colors flex justify-center items-center">
                        <span x-show="!loading">Check Status</span>
                        <span x-show="loading">
                            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                        </span>
                    </button>
                </form>
            </div>
        </div>

        <template x-if="error">
            <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-lg mb-6 flex">
                <i data-lucide="alert-circle" class="w-5 h-5 text-red-500 mr-2 mt-0.5"></i>
                <p class="text-red-700" x-text="error"></p>
            </div>
        </template>

        <div x-show="jobResult" x-cloak class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <div>
                    <p class="text-sm text-slate-500 font-medium">Job Number</p>
                    <p class="text-2xl font-bold text-slate-900" x-text="jobResult?.code"></p>
                </div>
                
                <!-- Status Badge -->
                <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium"
                      :class="{
                          'bg-yellow-100 text-yellow-800': jobResult?.status === 'pending',
                          'bg-blue-100 text-blue-800': jobResult?.status === 'printing',
                          'bg-green-100 text-green-800': jobResult?.status === 'done',
                          'bg-red-100 text-red-800': jobResult?.status === 'cancelled'
                      }">
                    <span x-show="jobResult?.status === 'pending'" class="mr-1.5 w-2 h-2 rounded-full bg-yellow-500"></span>
                    <span x-show="jobResult?.status === 'printing'" class="mr-1.5 w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
                    <span x-show="jobResult?.status === 'done'" class="mr-1.5 w-2 h-2 rounded-full bg-green-500"></span>
                    <span x-show="jobResult?.status === 'cancelled'" class="mr-1.5 w-2 h-2 rounded-full bg-red-500"></span>
                    
                    <span x-text="statusText(jobResult?.status)"></span>
                </span>
            </div>
            
            <div class="p-6 space-y-4">
                <div class="flex items-start">
                    <i data-lucide="store" class="w-5 h-5 text-slate-400 mr-3 mt-0.5"></i>
                    <div>
                        <p class="text-sm text-slate-500 font-medium">Shop</p>
                        <p class="text-slate-900 font-medium" x-text="jobResult?.shopName"></p>
                    </div>
                </div>
                
                <div class="flex items-start">
                    <i data-lucide="clock" class="w-5 h-5 text-slate-400 mr-3 mt-0.5"></i>
                    <div>
                        <p class="text-sm text-slate-500 font-medium">Created</p>
                        <p class="text-slate-900 font-medium" x-text="jobResult?.createdAt"></p>
                    </div>
                </div>
                
                <div class="pt-4 border-t border-slate-100">
                    <p class="text-sm text-slate-500 font-medium mb-2">Files (<span x-text="jobResult?.files.length"></span>)</p>
                    <ul class="space-y-2">
                        <template x-for="file in jobResult?.files">
                            <li class="flex items-center text-sm text-slate-700 bg-slate-50 p-2 rounded-lg border border-slate-100">
                                <i data-lucide="file" class="w-4 h-4 text-slate-400 mr-2"></i>
                                <span class="truncate flex-1" x-text="file.name"></span>
                                <span class="text-xs text-slate-500 ml-2 border-l border-slate-300 pl-2" x-text="file.copies + ' copies'"></span>
                            </li>
                        </template>
                    </ul>
                </div>
                
                <template x-if="jobResult?.status === 'done' || jobResult?.status === 'cancelled'">
                    <div class="mt-4 p-3 bg-slate-50 rounded-lg text-sm text-slate-500 text-center flex items-center justify-center border border-slate-100">
                        <i data-lucide="shield-check" class="w-4 h-4 mr-1 text-green-600"></i>
                        Files have been securely deleted
                    </div>
                </template>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('trackApp', () => ({
                jobCodeInput: '',
                loading: false,
                error: null,
                jobResult: null,
                autoRefreshTimer: null,
                
                init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const code = urlParams.get('code');
                    if (code) {
                        this.jobCodeInput = code;
                        this.trackJob();
                    }
                    setTimeout(() => lucide.createIcons(), 100);
                },

                async trackJob() {
                    this.loading = true;
                    this.error = null;
                    
                    if (this.autoRefreshTimer) clearInterval(this.autoRefreshTimer);

                    // Mock API call
                    setTimeout(() => {
                        if (this.jobCodeInput === '0000') {
                            this.error = "Job not found — check your number";
                            this.jobResult = null;
                        } else {
                            this.jobResult = {
                                code: this.jobCodeInput,
                                status: ['pending', 'printing', 'done'][Math.floor(Math.random()*3)],
                                shopName: "City Print Station",
                                createdAt: "Today at 2:30 PM",
                                files: [
                                    { name: "document.pdf", copies: 2 },
                                    { name: "photo.jpg", copies: 1 }
                                ]
                            };
                            
                            // Auto refresh if not done/cancelled
                            if (this.jobResult.status === 'pending' || this.jobResult.status === 'printing') {
                                this.autoRefreshTimer = setInterval(() => {
                                    this.trackJobSilently();
                                }, 15000);
                            }
                        }
                        this.loading = false;
                        setTimeout(() => lucide.createIcons(), 10);
                    }, 800);
                },

                async trackJobSilently() {
                    // Update state without showing loading spinner
                    console.log("Auto-refreshing status...");
                    // Mock advancement
                    if (this.jobResult.status === 'pending') this.jobResult.status = 'printing';
                    else if (this.jobResult.status === 'printing') {
                        this.jobResult.status = 'done';
                        clearInterval(this.autoRefreshTimer);
                    }
                },

                statusText(status) {
                    const map = {
                        'pending': 'Pending',
                        'printing': 'Printing Now',
                        'done': 'Done',
                        'cancelled': 'Cancelled'
                    };
                    return map[status] || status;
                }
            }));
        });
    </script>
</body>
</html>
