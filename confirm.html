<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Successful! – Printez</title>
    <meta name="description" content="Your files have been uploaded to the print shop. Show your job number at the counter.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
        .success-checkmark {
            width: 80px; height: 80px; margin: 0 auto;
            border-radius: 50%; display: block;
            stroke-width: 2; stroke: #fff;
            stroke-miterlimit: 10;
            box-shadow: inset 0px 0px 0px #16A34A;
            animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
        }
        .success-checkmark__circle {
            stroke-dasharray: 166; stroke-dashoffset: 166; stroke-width: 2;
            stroke-miterlimit: 10; stroke: #16A34A; fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }
        .success-checkmark__check {
            transform-origin: 50% 50%; stroke-dasharray: 48; stroke-dashoffset: 48;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }
        @keyframes stroke { 100% { stroke-dashoffset: 0; } }
        @keyframes scale { 0%, 100% { transform: none; } 50% { transform: scale3d(1.1, 1.1, 1); } }
        @keyframes fill { 100% { box-shadow: inset 0px 0px 0px 50px #16A34A; } }
        [x-cloak] { display: none !important; }
        #job-qr-code img, #job-qr-code canvas { margin: 0 auto; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col" x-data="confirmApp()">

    <!-- Top Navigation -->
    <nav class="bg-white border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="index.html" class="flex items-center space-x-2">
                    <i data-lucide="printer" class="w-8 h-8 text-blue-600"></i>
                    <span class="font-bold text-xl tracking-tight text-blue-900">Printez</span>
                </a>
                <a href="track.html" class="text-sm text-slate-500 hover:text-blue-600 font-medium flex items-center gap-1">
                    <i data-lucide="search" class="w-4 h-4"></i>
                    Track a job
                </a>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4 py-10">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100 relative">
            
            <!-- Delete countdown bar -->
            <div class="absolute top-0 left-0 w-full h-1.5 bg-slate-100">
                <div class="h-1.5 bg-gradient-to-r from-green-400 to-red-500 transition-all duration-1000 ease-linear" :style="`width: ${100 - deleteProgress}%`"></div>
            </div>

            <div class="p-8 text-center">
                <!-- Checkmark Animation -->
                <div class="mb-6">
                    <svg class="success-checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                        <circle class="success-checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
                        <path class="success-checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                    </svg>
                </div>

                <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-2">Files uploaded!</h1>
                <p class="text-slate-600 mb-6">
                    Sent to <span class="font-bold" x-text="shopName || 'the print shop'"></span>
                </p>

                <!-- Job Number Display -->
                <div class="bg-gradient-to-br from-blue-50 to-indigo-50 border-2 border-blue-200 rounded-xl p-6 mb-5">
                    <p class="text-xs font-bold text-blue-700 uppercase tracking-widest mb-3">Your Job Number</p>
                    <div class="text-7xl font-black text-blue-900 tracking-widest bg-white py-4 rounded-xl border border-blue-100 shadow-sm select-all cursor-text" x-text="jobCode">
                        ----
                    </div>
                    <p class="mt-4 text-slate-700 font-semibold text-lg">আপনার নম্বর: <span x-text="bnNum(jobCode)" class="text-blue-800"></span></p>
                    <p class="text-sm text-slate-500 mt-1">Show this number at the counter</p>
                </div>

                <!-- Timer Warning -->
                <div class="flex items-center justify-center text-sm text-amber-700 bg-amber-50 py-2.5 px-4 rounded-lg mb-5 border border-amber-200">
                    <i data-lucide="clock" class="w-4 h-4 mr-2 shrink-0"></i>
                    Files will be auto-deleted in <span class="font-bold mx-1" x-text="minutesLeft"></span> min for your privacy
                </div>

                <!-- QR Code of Job Number -->
                <div class="mb-5">
                    <p class="text-xs text-slate-500 font-medium mb-2 uppercase tracking-wide">Scan at Counter</p>
                    <div id="job-qr-code" class="flex justify-center"></div>
                </div>

                <!-- Share / Copy Buttons -->
                <div class="flex gap-2 mb-5">
                    <button @click="copyCode" class="flex-1 flex items-center justify-center gap-2 text-sm font-medium py-2.5 px-3 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-50 transition-colors">
                        <i data-lucide="copy" class="w-4 h-4"></i>
                        <span x-text="copied ? 'Copied!' : 'Copy Code'"></span>
                    </button>
                    <a :href="whatsappLink" target="_blank" class="flex-1 flex items-center justify-center gap-2 text-sm font-medium py-2.5 px-3 rounded-lg bg-green-50 border border-green-200 text-green-700 hover:bg-green-100 transition-colors">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                        Share on WhatsApp
                    </a>
                </div>

                <!-- Action Buttons -->
                <div class="space-y-3">
                    <a :href="`track.html?code=${jobCode}&shop=${shopSlug}`" class="block w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-xl shadow hover:bg-blue-700 transition-colors flex items-center justify-center gap-2">
                        <i data-lucide="search" class="w-4 h-4"></i>
                        Track Print Status
                    </a>
                    <a :href="`upload.html?shop=${shopSlug}`" class="block w-full bg-white text-slate-700 font-bold py-3 px-4 rounded-xl border border-slate-300 shadow-sm hover:bg-slate-50 transition-colors">
                        Upload More Files
                    </a>
                </div>

                <div class="mt-6 pt-6 border-t border-slate-100">
                    <p class="text-xs text-slate-500 flex items-center justify-center gap-1">
                        <i data-lucide="camera" class="w-4 h-4"></i>
                        Tip: Take a screenshot of this page
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('confirmApp', () => ({
                jobCode: '----',
                shopSlug: '',
                shopName: '',
                minutesLeft: 30,
                deleteProgress: 0,
                copied: false,
                whatsappLink: '#',

                init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    this.jobCode = urlParams.get('code') || '0000';
                    this.shopSlug = urlParams.get('shop') || '';

                    setTimeout(() => {
                        lucide.createIcons();
                        this.generateQR();
                        this.buildWhatsApp();
                    }, 100);

                    this.loadJobInfo();
                    this.startTimer();
                },

                async loadJobInfo() {
                    if (!this.shopSlug || !this.jobCode || this.jobCode === '0000') return;
                    try {
                        const res = await fetch(`api/jobs.php?action=track&job_code=${encodeURIComponent(this.jobCode)}&shop_slug=${encodeURIComponent(this.shopSlug)}`);
                        const data = await res.json();
                        if (data.success && data.data) {
                            this.shopName = data.data.shop_name || '';
                            if (data.data.expires_at) {
                                const expiry = new Date(data.data.expires_at.replace(' ', 'T'));
                                const now = new Date();
                                const diffMs = expiry - now;
                                this.minutesLeft = Math.max(0, Math.ceil(diffMs / 60000));
                            }
                        }
                    } catch (e) { /* use defaults */ }
                },

                startTimer() {
                    let secondsPassed = 0;
                    const totalSeconds = this.minutesLeft * 60 || 30 * 60;
                    setInterval(() => {
                        secondsPassed++;
                        const remaining = totalSeconds - secondsPassed;
                        this.minutesLeft = Math.max(0, Math.ceil(remaining / 60));
                        this.deleteProgress = Math.min(100, (secondsPassed / totalSeconds) * 100);
                    }, 1000);
                },

                generateQR() {
                    const el = document.getElementById('job-qr-code');
                    if (!el || typeof QRCode === 'undefined') return;
                    el.innerHTML = '';
                    new QRCode(el, {
                        text: this.jobCode,
                        width: 120,
                        height: 120,
                        colorDark: '#1e3a8a',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H
                    });
                },

                buildWhatsApp() {
                    const msg = `My Printez job number is: *${this.jobCode}*\nShop: ${this.shopName || this.shopSlug}\nTrack: ${window.location.origin}/track.html?code=${this.jobCode}&shop=${this.shopSlug}`;
                    this.whatsappLink = `https://wa.me/?text=${encodeURIComponent(msg)}`;
                },

                async copyCode() {
                    try {
                        await navigator.clipboard.writeText(this.jobCode);
                        this.copied = true;
                        setTimeout(() => this.copied = false, 2000);
                    } catch (e) {
                        // fallback
                        const el = document.createElement('textarea');
                        el.value = this.jobCode;
                        document.body.appendChild(el);
                        el.select();
                        document.execCommand('copy');
                        document.body.removeChild(el);
                        this.copied = true;
                        setTimeout(() => this.copied = false, 2000);
                    }
                },

                bnNum(engNum) {
                    const bnDigits = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
                    return (engNum + '').replace(/[0-9]/g, w => bnDigits[w] || w);
                }
            }));
        });
    </script>
</body>
</html>
