<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account – Printez</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8" x-data="registerApp()">

    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <a href="../index.html" class="inline-flex items-center space-x-2 mb-6">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center">
                <i data-lucide="printer" class="w-6 h-6 text-white"></i>
            </div>
            <span class="font-bold text-2xl tracking-tight text-slate-900">Printez</span>
        </a>
        <h2 class="text-center text-3xl font-extrabold text-slate-900">Create your account</h2>
        <p class="mt-2 text-center text-sm text-slate-600">
            Already have an account? <a href="login.html" class="font-medium text-blue-600 hover:text-blue-500">Sign in</a>
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow-xl shadow-slate-200/50 sm:rounded-2xl sm:px-10 border border-slate-100">
            <form class="space-y-5" @submit.prevent="submit">
                
                <div x-show="error" class="bg-red-50 text-red-600 p-3 rounded-lg text-sm border border-red-100" x-text="error" x-cloak></div>

                <div>
                    <label class="block text-sm font-medium text-slate-700">Full Name</label>
                    <div class="mt-1 relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="user" class="h-5 w-5 text-slate-400"></i>
                        </div>
                        <input type="text" required x-model="form.name" class="appearance-none block w-full pl-10 px-3 py-2.5 border border-slate-300 rounded-xl shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700">Email address</label>
                    <div class="mt-1 relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="mail" class="h-5 w-5 text-slate-400"></i>
                        </div>
                        <input type="email" required x-model="form.email" class="appearance-none block w-full pl-10 px-3 py-2.5 border border-slate-300 rounded-xl shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700">Phone (Optional)</label>
                    <div class="mt-1 relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="phone" class="h-5 w-5 text-slate-400"></i>
                        </div>
                        <input type="tel" x-model="form.phone" class="appearance-none block w-full pl-10 px-3 py-2.5 border border-slate-300 rounded-xl shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700">Password</label>
                    <div class="mt-1 relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="lock" class="h-5 w-5 text-slate-400"></i>
                        </div>
                        <input type="password" required x-model="form.password" class="appearance-none block w-full pl-10 px-3 py-2.5 border border-slate-300 rounded-xl shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                </div>

                <div class="flex items-center">
                    <input id="terms" type="checkbox" required class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 rounded">
                    <label for="terms" class="ml-2 block text-sm text-slate-900">I agree to the <a href="#" class="text-blue-600 hover:underline">Terms & Conditions</a></label>
                </div>

                <div>
                    <button type="submit" :disabled="loading" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-70">
                        <span x-show="!loading">Create Account</span>
                        <span x-show="loading">Creating...</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('registerApp', () => ({
                form: { name: '', email: '', phone: '', password: '' },
                loading: false,
                error: '',
                
                init() {
                    lucide.createIcons();
                },
                
                async submit() {
                    this.loading = true;
                    this.error = '';

                    try {
                        const body = new URLSearchParams();
                        body.append('name', this.form.name);
                        body.append('email', this.form.email);
                        body.append('phone', this.form.phone || '');
                        body.append('password', this.form.password);

                        const res = await fetch('../api/auth.php?action=customer_register', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: body.toString()
                        });

                        const data = await res.json();
                        if (data.success) {
                            window.location.href = 'dashboard.html';
                        } else {
                            this.error = data.error || 'Registration failed. Please try again.';
                        }
                    } catch (e) {
                        this.error = 'Network error. Please try again.';
                    } finally {
                        this.loading = false;
                        setTimeout(() => lucide.createIcons(), 0);
                    }
                }
            }));
        });
    </script>
</body>
</html>
