<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - PrintShare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen" x-data="dashboardApp()">

    <!-- Top Navigation -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="../index.html" class="flex items-center space-x-2">
                    <i data-lucide="printer" class="w-8 h-8 text-blue-600"></i>
                    <span class="font-bold text-xl tracking-tight text-blue-900 hidden sm:block">PrintShare</span>
                </a>
                
                <div class="flex items-center space-x-4">
                    <div class="text-sm font-medium text-slate-700">
                        Hi, <span x-text="customer.name"></span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="mb-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <h1 class="text-2xl font-bold text-slate-900">My Account</h1>
        </div>

        <!-- Tabs -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="border-b border-slate-200 overflow-x-auto">
                <nav class="flex -mb-px px-2 sm:px-6" aria-label="Tabs">
                    <button @click="activeTab = 'history'" 
                            :class="activeTab === 'history' ? 'border-blue-500 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'"
                            class="whitespace-nowrap py-4 px-4 border-b-2 font-medium text-sm flex items-center">
                        <i data-lucide="list" class="w-4 h-4 mr-2"></i> My History
                    </button>
                    <button @click="activeTab = 'library'" 
                            :class="activeTab === 'library' ? 'border-blue-500 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'"
                            class="whitespace-nowrap py-4 px-4 border-b-2 font-medium text-sm flex items-center">
                        <i data-lucide="folder" class="w-4 h-4 mr-2"></i> My Library
                    </button>
                    <button @click="activeTab = 'profile'" 
                            :class="activeTab === 'profile' ? 'border-blue-500 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'"
                            class="whitespace-nowrap py-4 px-4 border-b-2 font-medium text-sm flex items-center">
                        <i data-lucide="user" class="w-4 h-4 mr-2"></i> Profile
                    </button>
                </nav>
            </div>

            <!-- Tab Content -->
            <div class="p-4 sm:p-6 bg-slate-50/50 min-h-[400px]">
                
                <!-- History Tab -->
                <div x-show="activeTab === 'history'" x-cloak>
                    <template x-if="loading">
                        <div class="flex justify-center py-10"><i data-lucide="loader-2" class="w-8 h-8 animate-spin text-blue-600"></i></div>
                    </template>
                    
                    <template x-if="!loading && history.length === 0">
                        <div class="text-center py-12">
                            <i data-lucide="clock" class="w-12 h-12 text-slate-300 mx-auto mb-4"></i>
                            <p class="text-slate-500">No print history yet.</p>
                        </div>
                    </template>

                    <div class="space-y-4">
                        <template x-for="job in history" :key="job.id">
                            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between gap-4">
                                <div>
                                    <div class="flex items-center gap-3 mb-2">
                                        <span class="font-bold text-lg text-slate-900">#<span x-text="job.code"></span></span>
                                        <span class="px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-800" x-show="job.status === 'done'">Done</span>
                                    </div>
                                    <p class="text-sm text-slate-600 mb-1"><i data-lucide="store" class="w-3 h-3 inline mr-1"></i> <span x-text="job.shopName"></span></p>
                                    <p class="text-xs text-slate-400"><i data-lucide="calendar" class="w-3 h-3 inline mr-1"></i> <span x-text="job.date"></span></p>
                                    <div class="mt-3 text-sm text-slate-700">
                                        <p class="font-medium mb-1">Files:</p>
                                        <ul class="list-disc list-inside text-xs text-slate-500 space-y-1">
                                            <template x-for="file in job.files">
                                                <li><span x-text="file.name"></span> (<span x-text="file.settings"></span>)</li>
                                            </template>
                                        </ul>
                                    </div>
                                </div>
                                <div class="flex sm:flex-col justify-end gap-2 shrink-0">
                                    <button class="px-4 py-2 bg-slate-100 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-200 flex items-center justify-center">
                                        <i data-lucide="rotate-cw" class="w-4 h-4 mr-2"></i> Print Again
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Library Tab -->
                <div x-show="activeTab === 'library'" x-cloak>
                    <div class="mb-4 flex justify-between items-center">
                        <h3 class="text-lg font-bold text-slate-900">Saved Files</h3>
                        <p class="text-sm text-slate-500">Used 45MB of 500MB</p>
                    </div>
                    
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                        <template x-for="file in library" :key="file.id">
                            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm relative group hover:border-blue-300 transition-colors">
                                <button @click="deleteFile(file.id)" class="absolute top-2 right-2 p-1.5 bg-white/80 rounded-full text-slate-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                                <div class="flex justify-center mb-3 text-blue-500 mt-2">
                                    <i data-lucide="file-text" class="w-10 h-10" x-show="file.type === 'pdf'"></i>
                                    <i data-lucide="image" class="w-10 h-10 text-green-500" x-show="file.type === 'image'"></i>
                                </div>
                                <p class="text-sm font-medium text-slate-900 truncate text-center" x-text="file.name"></p>
                                <p class="text-xs text-slate-500 text-center mt-1" x-text="file.size"></p>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Profile Tab -->
                <div x-show="activeTab === 'profile'" x-cloak class="max-w-md">
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm mb-6">
                        <h3 class="text-lg font-bold text-slate-900 mb-4">Account Details</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Name</label>
                                <input type="text" x-model="customer.name" class="w-full border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                                <input type="email" x-model="customer.email" disabled class="w-full border-slate-200 bg-slate-50 rounded-lg text-slate-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Phone</label>
                                <input type="tel" x-model="customer.phone" class="w-full border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                            </div>
                            <button class="bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-800">Save Changes</button>
                        </div>
                    </div>
                    
                    <button @click="logout" class="w-full bg-red-50 text-red-600 border border-red-200 py-3 rounded-xl font-medium hover:bg-red-100 flex items-center justify-center">
                        <i data-lucide="log-out" class="w-5 h-5 mr-2"></i> Sign Out
                    </button>
                </div>

            </div>
        </div>
    </main>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('dashboardApp', () => ({
                activeTab: 'history',
                loading: true,
                customer: { name: '', email: '', phone: '' },
                history: [],
                library: [],
                
                async init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    if (urlParams.get('tab')) this.activeTab = urlParams.get('tab');
                    
                    try {
                        // Check authentication
                        const authRes = await fetch('/printshare/api/auth.php?action=customer_me');
                        const authData = await authRes.json();
                        if (!authData.success || !authData.data) {
                            window.location.href = 'login.html';
                            return;
                        }
                        this.customer = authData.data;

                        // Load data
                        await Promise.all([this.loadHistory(), this.loadLibrary()]);
                    } catch (e) {
                        window.location.href = 'login.html';
                    } finally {
                        this.loading = false;
                        setTimeout(() => lucide.createIcons(), 100);
                    }
                },

                async loadHistory() {
                    try {
                        const res = await fetch('/printshare/api/customer.php?action=history');
                        const data = await res.json();
                        if (data.success) {
                            this.history = (data.data || []).map(j => ({
                                id: j.id,
                                code: j.job_code,
                                status: j.status,
                                shopName: j.shop_name || 'Print Shop',
                                date: new Date(j.created_at).toLocaleDateString(),
                                files: (j.files || []).map(f => ({
                                    name: f.original_name,
                                    settings: `${f.copies} copies, ${f.color_mode === 'color' ? 'Color' : 'B&W'}`
                                }))
                            }));
                        }
                    } catch (e) {
                        console.error('Failed to load history', e);
                    }
                },

                async loadLibrary() {
                    try {
                        const res = await fetch('/printshare/api/customer.php?action=library');
                        const data = await res.json();
                        if (data.success) {
                            this.library = (data.data || []).map(f => ({
                                id: f.id,
                                name: f.original_name,
                                type: f.file_type === 'pdf' ? 'pdf' : 'image',
                                size: (f.file_size / (1024 * 1024)).toFixed(1) + ' MB'
                            }));
                        }
                    } catch (e) {
                        console.error('Failed to load library', e);
                    }
                },

                async deleteFile(id) {
                    if (confirm('Delete this saved file?')) {
                        try {
                            const body = new URLSearchParams({ file_id: id });
                            const res = await fetch('/printshare/api/customer.php?action=delete_library_file', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                                body: body.toString()
                            });
                            const data = await res.json();
                            if (data.success) {
                                this.library = this.library.filter(f => f.id !== id);
                            } else {
                                alert(data.error || 'Failed to delete file');
                            }
                        } catch (e) {
                            alert('Network error');
                        }
                    }
                },
                
                async logout() {
                    await fetch('/printshare/api/auth.php?action=customer_logout', { method: 'POST' });
                    window.location.href = '../index.html';
                }
            }));
        });
    </script>
</body>
</html>
